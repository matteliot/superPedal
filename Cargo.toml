[package]
name = "super_pedal"
description = 'Polyend Endless patch: every band pedal in one, picked on the left knob and announced by voice'
edition = "2024"
version = "0.1.0"
license = "MIT"

[[bin]]
name = "super_pedal"
test = false
bench = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = true # symbols stay in the ELF only; the .endl is a raw image

[profile.dev]
panic = "abort"
opt-level = 1
